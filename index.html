document.getElementById("flashcard").addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById("flashcard").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) document.getElementById("nextBtn").click();
    else         document.getElementById("prevBtn").click();
  }
}, { passive: true });

/* ============================================================
   SPEECH / AUDIO
   Uses the Web Speech API (SpeechSynthesis) — built into
   Safari, Chrome, Firefox. No API key or network needed.

   DIALECT → LANGUAGE CODE MAPPING
   Each dialect maps to a BCP-47 lang code. The engine tries
   the most specific voice first (e.g. es-CO), then falls
   back through es-419 → es-US → es-MX → es-ES → es.

   To adjust speech rate or pitch, edit SPEECH_RATE / SPEECH_PITCH.
============================================================ */
const DIALECT_LANG = {
  "Colombia":  "es-CO",
  "Mexico":    "es-MX",
  "Spain":     "es-ES",
  "Argentina": "es-AR",
  "Peru":      "es-PE",
  "Chile":     "es-CL",
  "Universal": "es",
};

const SPEECH_RATE  = 0.88;   // 0.1–10, default 1. Lower = slower / clearer.
const SPEECH_PITCH = 1.0;    // 0–2, default 1.

// Cache voices once loaded
let _voices = [];
function loadVoices() {
  _voices = window.speechSynthesis.getVoices();
}
loadVoices();
if (window.speechSynthesis.onvoiceschanged !== undefined) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

/**
 * getBestVoice(lang)
 * Picks the closest available voice for a given BCP-47 code.
 * Tries exact match → prefix match → generic 'es' → first Spanish voice.
 */
function getBestVoice(lang) {
  const voices = _voices.length ? _voices : window.speechSynthesis.getVoices();
  const exact  = voices.find(v => v.lang === lang);
  if (exact) return exact;
  // Prefix match: "es-CO" → find any "es-CO*"
  const prefix = voices.find(v => v.lang.startsWith(lang));
  if (prefix) return prefix;
  // Fallback chain: es-419, es-US, es-MX, es-ES, es
  const fallbacks = ["es-419", "es-US", "es-MX", "es-ES", "es"];
  for (const fb of fallbacks) {
    const found = voices.find(v => v.lang === fb || v.lang.startsWith(fb));
    if (found) return found;
  }
  // Last resort: any Spanish voice
  return voices.find(v => v.lang.startsWith("es")) || null;
}

/**
 * speak(text, lang, btnEl)
 * Cancels any current speech and reads `text` aloud.
 * Animates btnEl with the .speaking class while reading.
 * @param {string}      text  - Text to speak
 * @param {string}      lang  - BCP-47 language code (e.g. "es-CO", "en-US")
 * @param {HTMLElement} btnEl - The audio button element to animate
 */
function speak(text, lang, btnEl) {
  if (!window.speechSynthesis) {
    showToast("Speech not supported in this browser");
    return;
  }
  // Stop any current utterance
  window.speechSynthesis.cancel();

  // Remove speaking state from all buttons
  document.querySelectorAll(".audio-btn").forEach(b => b.classList.remove("speaking"));

  const utt   = new SpeechSynthesisUtterance(text);
  utt.lang    = lang;
  utt.rate    = SPEECH_RATE;
  utt.pitch   = SPEECH_PITCH;

  const voice = getBestVoice(lang);
  if (voice) utt.voice = voice;

  // Animate button while speaking
  if (btnEl) {
    btnEl.classList.add("speaking");
    utt.onend   = () => btnEl.classList.remove("speaking");
    utt.onerror = () => btnEl.classList.remove("speaking");
  }

  window.speechSynthesis.speak(utt);
}

/**
 * getCurrentCard()
 * Returns the active card object.
 */
function getCurrentCard() {
  return cardData[currentTopic]?.[cardOrder[cardIndex]] || null;
}

// Single Listen button — always reads Spanish (outside card, no flip artifact)
document.getElementById("audioBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const card = getCurrentCard();
  if (!card) return;
  speak(card.es, DIALECT_LANG[dialect] || "es", e.currentTarget);
});

// Example sentence listen button — main view
document.getElementById("exampleListenBtn").addEventListener("click", (e) => {
  e.stopPropagation(); // don't trigger tap-to-translate on the parent
  const card = getCurrentCard();
  if (!card?.example) return;
  speak(card.example, DIALECT_LANG[dialect] || "es", e.currentTarget);
});

// Example sentence listen button — focus overlay
document.getElementById("focusExampleListenBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const card = getCurrentCard();
  if (!card?.example) return;
  speak(card.example, DIALECT_LANG[dialect] || "es", e.currentTarget);
});

// Stop speech when navigating to a new card
function stopSpeech() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll(".audio-btn").forEach(b => b.classList.remove("speaking"));
}

/* ============================================================
   FOCUS MODE
   A full-screen overlay showing only the card + nav controls.
   Shares the same cardData / cardOrder / cardIndex state as
   the main view so both stay in sync.
============================================================ */
let focusFlipped = false;

/** Populate the focus card from current state */
function renderFocusCard() {
  const cards = cardData[currentTopic] || [];
  if (!cards.length) { exitFocus(); return; }
  const card  = getCurrentCard();
  if (!card) { exitFocus(); return; }
  const front = displayMode === "en" ? card.en : card.es;
  const back  = displayMode === "en" ? card.es : card.en;
  const label = topicLabel(currentTopic);

  document.getElementById("focusFrontBadge").textContent = label;
  document.getElementById("focusBackBadge").textContent  = label;
  document.getElementById("focusFrontWord").textContent  = front;
  document.getElementById("focusBackWord").textContent   = back;
  document.getElementById("focusExampleText").textContent = card.example || "";

  // Reset example + translation
  document.getElementById("focusExampleSentence").classList.remove("visible");
  document.getElementById("focusExampleTranslation").classList.remove("visible");
  document.getElementById("focusExampleTranslation").textContent = "";
  document.getElementById("focusExampleTranslation").dataset.cached = "";
  document.getElementById("focusTapHint").textContent = "";

  // Sentence button visibility
  const hasSentenceF = !!card.example;
  document.getElementById("focusSentenceBackBtn").style.display  = (displayMode === "en" && hasSentenceF) ? "" : "none";
  document.getElementById("focusSentenceBackBtn").textContent    = "Sentence";
  document.getElementById("focusSentenceFrontBtn").style.display = (displayMode === "es" && hasSentenceF) ? "" : "none";
  document.getElementById("focusSentenceFrontBtn").textContent   = "Sentence";

  // Sync flip state
  focusFlipped = false;
  document.getElementById("focusCard").classList.remove("flipped");

  // Progress
  const pct = cards.length > 1 ? ((cardIndex + 1) / cards.length) * 100 : 100;
  document.getElementById("focusProgressFill").style.width = pct + "%";
  document.getElementById("focusCount").textContent = `${cardIndex + 1} / ${cards.length}`;
}

/** Open focus mode */
function enterFocus() {
  if (!getCurrentCard()) return;
  stopSpeech();
  renderFocusCard();
  document.getElementById("focusOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}

/** Close focus mode */
function exitFocus() {
  stopSpeech();
  document.getElementById("focusOverlay").classList.remove("active");
  document.body.style.overflow = "";
  // Sync main view in case user navigated in focus mode
  renderCard();
}

// Enter focus
document.getElementById("focusBtn").addEventListener("click", enterFocus);

// Exit focus
document.getElementById("focusExitBtn").addEventListener("click", exitFocus);

// Escape key exits
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("focusOverlay").classList.contains("active")) {
    exitFocus();
  }
});

// Focus card flip
document.getElementById("focusCard").addEventListener("click", () => {
  focusFlipped = !focusFlipped;
  document.getElementById("focusCard").classList.toggle("flipped", focusFlipped);
});
document.getElementById("focusCard").addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); document.getElementById("focusCard").click(); }
});

// Focus next / prev / shuffle
document.getElementById("focusNextBtn").addEventListener("click", () => {
  const cards = cardData[currentTopic] || [];
  if (!cards.length) return;
  stopSpeech();
  cardIndex = (cardIndex + 1) % cards.length;
  renderFocusCard();
  renderCard(); // keep main in sync
});
document.getElementById("focusPrevBtn").addEventListener("click", () => {
  const cards = cardData[currentTopic] || [];
  if (!cards.length) return;
  stopSpeech();
  cardIndex = (cardIndex - 1 + cards.length) % cards.length;
  renderFocusCard();
  renderCard();
});
document.getElementById("focusShuffleBtn").addEventListener("click", () => {
  stopSpeech();
  for (let i = cardOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cardOrder[i], cardOrder[j]] = [cardOrder[j], cardOrder[i]];
  }
  cardIndex = 0;
  renderFocusCard();
  renderCard();
  showToast("Cards shuffled");
});

// Focus Listen button — single button outside card, always Spanish
document.getElementById("focusAudioBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const card = getCurrentCard();
  if (!card) return;
  speak(card.es, DIALECT_LANG[dialect] || "es", e.currentTarget);
});

// Focus example sentence — shared handler for front+back sentence buttons
function toggleFocusExampleSentence(e) {
  e.stopPropagation();
  const card = getCurrentCard();
  const sent = document.getElementById("focusExampleSentence");
  if (!card?.example) return;
  const visible = sent.classList.toggle("visible");
  const label = visible ? "Hide" : "Sentence";
  document.getElementById("focusSentenceBackBtn").textContent  = label;
  document.getElementById("focusSentenceFrontBtn").textContent = label;
  if (!visible) {
    document.getElementById("focusExampleTranslation").classList.remove("visible");
    document.getElementById("focusTapHint").textContent = "";
  }
}
document.getElementById("focusSentenceBackBtn").addEventListener("click", toggleFocusExampleSentence);
document.getElementById("focusSentenceFrontBtn").addEventListener("click", toggleFocusExampleSentence);

// Focus example tap-to-translate
document.getElementById("focusExampleSentence").addEventListener("click", (e) => {
  e.stopPropagation();
  handleSentenceTap(getCurrentCard(), document.getElementById("focusExampleTranslation"), document.getElementById("focusTapHint"));
});

// Focus swipe (left = next, right = prev)
let focusTouchX = 0, focusTouchY = 0;
document.getElementById("focusCard").addEventListener("touchstart", e => {
  focusTouchX = e.touches[0].clientX;
  focusTouchY = e.touches[0].clientY;
}, { passive: true });
document.getElementById("focusCard").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - focusTouchX;
  const dy = e.changedTouches[0].clientY - focusTouchY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) document.getElementById("focusNextBtn").click();
    else         document.getElementById("focusPrevBtn").click();
  }
}, { passive: true });

/* ============================================================
   INIT
============================================================ */
(function init() {
  loadStoredData();

  const savedTheme   = localStorage.getItem(LS_THEME)   || "dark";
  const savedMode    = localStorage.getItem(LS_MODE)    || "en";
  const savedDialect = localStorage.getItem(LS_DIALECT) || "Colombia";
  const savedTopic   = localStorage.getItem(LS_TOPIC);

  setTheme(savedTheme);
  updateApiKeyUI();

  displayMode = savedMode;
  document.getElementById("modeEn").classList.toggle("active", displayMode === "en");
  document.getElementById("modeEs").classList.toggle("active", displayMode === "es");

  dialect = savedDialect;
  document.getElementById("dialectSelect").value = savedDialect;

  const topics = Object.keys(cardData);
  currentTopic = (savedTopic && hasTopic(savedTopic)) ? savedTopic : (topics.sort()[0] || "");
  // Ask the browser to keep this data (helps stop Safari clearing it)
  try { navigator.storage?.persist?.(); } catch {}

  renderTopicSelects();
  document.getElementById("topicSelect").value = currentTopic;
  resetOrder();
  renderCard();
  // Turn animations back on once the first frame has been drawn (prevents a light-mode flash)
  const endPreload = () => document.documentElement.classList.remove("preload");
  requestAnimationFrame(() => requestAnimationFrame(endPreload));
  setTimeout(endPreload, 120);   // fallback if animation frames are paused
})();
</script>
</body>
</html>
